<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Claude Office</title>
    <link rel="stylesheet" href="/src/style.css" />

  <body class="bg-slate-950 text-slate-200 font-sans text-sm">

    <main class="grid gap-6 p-4">

      <section><h2 class="mb-2 font-semibold">Agentes</h2><div id="agents"></div></section>

    <script type="module" src="/src/main.ts"></script>
